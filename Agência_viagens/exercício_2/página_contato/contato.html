<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contato.css">
    <script src="contato.js" defer></script>
    <title>ViajeBem - Contato</title>
</head>

<body>
    <h1>Converse Conosco - ViajeBem</h1>

    <form id="formContato" action="" method="POST">
        
        <!-- nome completo do usuário -->
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" />
        </div>

        <br>

        <!-- telefone do usuário -->
        <div>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" />
        </div>

        <br>

        <!-- email do usuário -->
        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" />
        </div>

        <br>

        <!-- mensagem -->
        <div>
            <label for="mensagem">Mensagem:</label>
            <br>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>
        </div>

        <br>

        <!-- botao enviar -->
        <div>
            <button type="submit" id="btnEnviar">Enviar mensagem</button>
        </div>

    </form>

    <br>
    <!-- local onde a confirmacao ou o erro vao aparecer -->
    <div id="resultado-contato"></div>

</body>

</html>
