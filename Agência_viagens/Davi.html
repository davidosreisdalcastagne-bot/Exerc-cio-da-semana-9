<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>ViajeBem</title>
</head>

<body>
    <h1>ViageBem orcamentos</h1>

    <!-- mensagem geral de erro ou sucesso da aplicacao -->
    <div id="mensagem-status"></div>
    <br>

    <form id="formCadastro" action="" method="POST">
        
        <!-- dados pessoais -->
        <div class="campo-dados-pessoais">
            <label for="nome">Nome completo:</label>
            <input type="text" name="nome" id="nome" placeholder="ex: Davi Reis" autocomplete="name" required />
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="ex: davireis@exemplo.com" autocomplete="email" required />
            <br>
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" id="telefone" placeholder="ex: (99) 99999-9999" autocomplete="tel" required />
            <small id="erro-telefone" class="erro-campo"></small>
        </div>

        <br>

        <!-- destino -->
        <div class="campo-destino">
            <label for="destino">Destinos de viagem:</label>
            <select id="destino" name="destino" required>
                <option value="">Selecione destino desejado</option>
                <option value="França">França</option>
                <option value="Itália">Itália</option>
                <option value="Reino Unido">Reino Unido</option>
                <option value="Japão">Japão</option>
            </select>
        </div>

        <br>

        <!-- escolha do plano -->
        <div class="campo-plano">
            <fieldset>
                <legend>Escolha seu plano:</legend>

                <input type="radio" id="plano-economico" name="plano" value="Econômico" />
                <label for="plano-economico">Plano Econômico</label>
                <br>

                <input type="radio" id="plano-comforto" name="plano" value="Conforto" />
                <label for="plano-comforto">Plano Conforto</label>
                <br>

                <input type="radio" id="plano-premium" name="plano" value="Premium" />
                <label for="plano-premium">Plano Premium</label>
            </fieldset>
            <small id="erro-pacote" class="erro-campo"></small>
        </div>

        <br>

        <!-- preferencias extras -->
        <div class="campo-preferencias">
            <fieldset>
                <legend>Preferências:</legend>

                <input type="checkbox" id="tours" name="preferencias" value="Tours guiados" />
                <label for="tours">Quero tours guiados</label>
                <br>

                <input type="checkbox" id="seguro" name="preferencias" value="Seguro viagem" />
                <label for="seguro">Quero seguro viagem</label>
                <br>

                <input type="checkbox" id="traslado" name="preferencias" value="Traslado" />
                <label for="traslado">Quero traslado</label>
            </fieldset>
        </div>

        <br>

        <!-- datas da viagem -->
        <div class="campo-datas">
            <label for="data-ida">Data de ida:</label>
            <input type="date" id="data-ida" name="data_ida" required />
            <br>

            <label for="data-volta">Data de volta:</label>
            <input type="date" id="data-volta" name="data_volta" required />
        </div>

        <br>

        <!-- observacoes -->
        <div class="campo-observacoes">
            <label for="mensagem">Observações: </label>
            <br>
            <textarea id="mensagem" name="observacoes" rows="5"></textarea>
            <!-- bonus 1: contador de caracteres -->
            <div id="contador-caracteres">0 / 200 caracteres</div>
        </div>

        <br>

        <!-- botao de enviar -->s
        <div class="campo-botao">
            <button type="submit">Enviar solicitação de orçamento</button>
        </div>

    </form>

    <br>
    <!-- div onde vai aparecer o resumo -->
    <div id="resumo"></div>

</body>

</html>
